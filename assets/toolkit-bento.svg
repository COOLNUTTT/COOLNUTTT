<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" fill="none">
  <defs>
    <linearGradient id="bgToolkit" x1="0" y1="0" x2="880" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="borderSub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="clipToolkit">
      <rect width="880" height="230" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <g clip-path="url(#clipToolkit)">
    <rect width="880" height="230" fill="url(#bgToolkit)"/>
    <rect x="0.75" y="0.75" width="878.5" height="228.5" rx="18" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- TILE 1: AI / ML & EXPLAINABILITY -->
    <rect x="16" y="16" width="272" height="198" rx="14" fill="url(#glassCard)" stroke="url(#borderSub)"/>
    <text x="34" y="44" class="mono" font-size="11" font-weight="700" letter-spacing="1.1" fill="#34D399">01 // AI &amp; ML SYSTEMS</text>
    <line x1="34" y1="54" x2="270" y2="54" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g transform="translate(34, 70)">
      <rect width="112" height="26" rx="7" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="56" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#A7F3D0">ONNX Runtime</text>

      <rect x="120" width="114" height="26" rx="7" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="177" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#A7F3D0">Scikit-Learn</text>

      <rect y="34" width="100" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="50" y="51" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Grad-CAM</text>

      <rect x="108" y="34" width="126" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="171" y="51" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">SHAP Explain</text>

      <rect y="68" width="126" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="63" y="85" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Active Learning</text>

      <rect x="134" y="68" width="100" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="184" y="85" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">pgvector</text>
    </g>
    <text x="34" y="196" class="sans" font-size="11.5" fill="#94A3B8">CPU/Web inference &amp; transparent ML</text>

    <!-- TILE 2: FULL-STACK & INFRA -->
    <rect x="304" y="16" width="272" height="198" rx="14" fill="url(#glassCard)" stroke="url(#borderSub)"/>
    <text x="322" y="44" class="mono" font-size="11" font-weight="700" letter-spacing="1.1" fill="#38BDF8">02 // FULL-STACK &amp; DATA</text>
    <line x1="322" y1="54" x2="558" y2="54" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g transform="translate(322, 70)">
      <rect width="84" height="26" rx="7" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="42" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#BAE6FD">FastAPI</text>

      <rect x="92" width="142" height="26" rx="7" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="163" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#BAE6FD">Next.js 15 + TS</text>

      <rect y="34" width="76" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="38" y="51" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Flask</text>

      <rect x="84" y="34" width="150" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="159" y="51" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Postgres + PostGIS</text>

      <rect y="68" width="110" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="55" y="85" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Supabase</text>

      <rect x="118" y="68" width="116" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="176" y="85" text-anchor="middle" class="mono" font-size="10.5" fill="#E2E8F0">Docker &amp; Git</text>
    </g>
    <text x="322" y="196" class="sans" font-size="11.5" fill="#94A3B8">End-to-end APIs, spatial DBs &amp; PWAs</text>

    <!-- TILE 3: HOW I BUILD -->
    <rect x="592" y="16" width="272" height="198" rx="14" fill="url(#glassCard)" stroke="url(#borderSub)"/>
    <text x="610" y="44" class="mono" font-size="11" font-weight="700" letter-spacing="1.1" fill="#818CF8">03 // HOW I ENGINEER</text>
    <line x1="610" y1="54" x2="846" y2="54" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g transform="translate(610, 74)">
      <circle cx="6" cy="5" r="3.5" fill="#34D399"/>
      <text x="18" y="9" class="sans" font-size="12.5" font-weight="600" fill="#F1F5F9">Privacy-First Architecture</text>
      <text x="18" y="25" class="sans" font-size="11" fill="#94A3B8">On-device scrubbing &amp; minimal PII</text>

      <circle cx="6" cy="51" r="3.5" fill="#38BDF8"/>
      <text x="18" y="55" class="sans" font-size="12.5" font-weight="600" fill="#F1F5F9">Human-in-the-Loop AI</text>
      <text x="18" y="71" class="sans" font-size="11" fill="#94A3B8">Confidence thresholds &amp; XAI reasons</text>

      <circle cx="6" cy="97" r="3.5" fill="#818CF8"/>
      <text x="18" y="101" class="sans" font-size="12.5" font-weight="600" fill="#F1F5F9">Clean, Honest Systems</text>
      <text x="18" y="117" class="sans" font-size="11" fill="#94A3B8">Documented, reproducible &amp; fast</text>
    </g>
  </g>
</svg>
